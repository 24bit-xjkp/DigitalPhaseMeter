# Scalafix 静态分析规则（检查用 `./mill fix --check`，自动修复用 `./mill fix`）。
# 规则作用于 `src/main/scala` 下的 RTL 源码；Mill 的构建定义 `build.mill` 用 Scala 3 编写，
# 由 scalafmt 负责格式化，不在 Scalafix 规则覆盖范围内。
#
# 误报用行内 `// scalafix:off <Rule>` / `// scalafix:on <Rule>` 精确抑制，不要整体关闭规则。
rules = [
  OrganizeImports,
  DisableSyntax,
  NoAutoTupling,
  NoValInForComprehension,
  LeakingImplicitClassVal
]

OrganizeImports {
  groups = [
    "re:javax?\\.",
    "scala.",
    "*"
  ]
  removeUnused = true
}

DisableSyntax {
  noVars = true
  noThrows = true
  noNulls = true
  noWhiles = true
  noReturns = true
  noFinalize = true
  noXml = true
}
