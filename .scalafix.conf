# Scalafix 静态分析规则（检查用 `./mill fix --check`，自动修复用 `./mill fix`）。
# 规则作用于 `src` 下的 RTL 源码（Scala 3）；Mill 的构建定义 `build.mill`
# 由 scalafmt 负责格式化，不在 Scalafix 规则覆盖范围内。
#
# 误报用行内 `// scalafix:off <Rule>` / `// scalafix:on <Rule>` 精确抑制，不要整体关闭规则。
rules = [
  OrganizeImports,
  DisableSyntax,
  NoAutoTupling,
  NoValInForComprehension,
  LeakingImplicitClassVal
]

OrganizeImports {
  # 源码是 Scala 3：通配导入输出 `*`（而不是 Scala 2 的 `_`），重命名输出 `as`。
  targetDialect = Scala3
  groups = [
    "re:javax?\\.",
    "scala.",
    "*"
  ]
  # Scala 3 的 semanticdb 不提供足够信息让 OrganizeImports 安全删除未用导入；
  # 未用导入由编译器 `-Wunused:imports`（配合 `-Werror`）拦截。
  removeUnused = false
}

DisableSyntax {
  noVars = true
  noThrows = true
  noNulls = true
  noWhiles = true
  noReturns = true
  noFinalize = true
  noXml = true
}
