version = "3.11.5"
runner.dialect = scala213
maxColumn = 120
indent {
  main = 4          # 主缩进
  callSite = 4      # 方法调用时的缩进
  defnSite = 4      # 方法定义时的缩进
  ctorSite = 4      # 构造函数参数的缩进
  extendSite = 4    # extends 子句的缩进
}
# 构建产物不参与格式检查：sbt 2 的 BSP 会把构建定义源码解压到 build/tmp-bsp-src，
# 不排除的话 `scalafmt --test`（无参数、递归扫描）会把这些生成文件当成未格式化的源文件。
project.excludeFilters = [
  ".*/build/.*",
  ".*/target/.*"
]
