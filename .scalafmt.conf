version = "3.11.5"
runner.dialect = scala213
maxColumn = 120
indent {
  main = 4          # 主缩进
  callSite = 4      # 方法调用时的缩进
  defnSite = 4      # 方法定义时的缩进
  ctorSite = 4      # 构造函数参数的缩进
  extendSite = 4    # extends 子句的缩进
}
# build.mill 是 Mill 的构建定义，用 Scala 3 语法编写；其余 Scala 源码仍是 Scala 2.13。
fileOverride {
  "glob:**/build.mill" {
    runner.dialect = scala3
  }
}
# 构建产物与构建工具输出不参与格式检查：Mill 的 out/ 会解压 worker 源码，
# build/ 下是 Chisel/Vivado 产物，都不是本仓库维护的源码。
project.excludeFilters = [
  ".*/build/.*",
  ".*/out/.*"
]
